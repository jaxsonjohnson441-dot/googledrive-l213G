<!DOCTYPE html>
<html>
<head>
  <title>Device + Internet Ping</title>
</head>
<body>

<h1>Network Status</h1>

<p id="os"></p>
<p id="internet"></p>
<p id="ping">Ping: ...</p>

<script>
  // OS detection
  let os = "Unknown OS";
  let userAgent = navigator.userAgent;

  if (userAgent.indexOf("iPhone") !== -1 || userAgent.indexOf("iPad") !== -1) {
    os = "iOS";
  } 
  else if (userAgent.indexOf("Android") !== -1) {
    os = "Android";
  } 
  else if (userAgent.indexOf("Windows") !== -1) {
    os = "Windows";
  } 
  else if (userAgent.indexOf("Mac") !== -1) {
    os = "macOS";
  } 
  else if (userAgent.indexOf("Linux") !== -1) {
    os = "Linux";
  }

  document.getElementById("os").innerText = "OS: " + os;

  // Internet status
  function updateInternet() {
    document.getElementById("internet").innerText =
      "Internet: " + (navigator.onLine ? "Online" : "Offline");
  }

  updateInternet();
  window.addEventListener("online", updateInternet);
  window.addEventListener("offline", updateInternet);

  // Fake real ping test using a fast request
  async function measurePing() {
    const start = performance.now();

    try {
      // lightweight request to a reliable endpoint
      await fetch("https://www.google.com/favicon.ico", { cache: "no-store", mode: "no-cors" });
      const end = performance.now();

      const ping = Math.round(end - start);
      document.getElementById("ping").innerText = "Ping: " + ping + " ms";
    } catch (e) {
      document.getElementById("ping").innerText = "Ping: Error";
    }
  }

  // run immediately
  measurePing();

  // update every 5 seconds
  setInterval(measurePing, 5000);
</script>

</body>
</html>
