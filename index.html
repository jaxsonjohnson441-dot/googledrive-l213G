<!DOCTYPE html>
<html>
<head>
  <title>Device + Internet Info</title>
</head>
<body>

<h1>Your Device Info</h1>

<p id="os"></p>
<p id="internet"></p>

<script>
  // OS detection (fixed version)
  let os = "Unknown OS";
  let userAgent = navigator.userAgent;

  if (userAgent.indexOf("iPhone") !== -1 || userAgent.indexOf("iPad") !== -1) {
    os = "iOS";
  } 
  else if (userAgent.indexOf("Android") !== -1) {
    os = "Android";
  } 
  else if (userAgent.indexOf("Windows") !== -1) {
    os = "Windows";
  } 
  else if (userAgent.indexOf("Mac") !== -1) {
    os = "macOS";
  } 
  else if (userAgent.indexOf("Linux") !== -1) {
    os = "Linux";
  }

  document.getElementById("os").innerText = "Operating System: " + os;

  // Internet connection status
  function updateInternetStatus() {
    if (navigator.onLine) {
      document.getElementById("internet").innerText = "Internet: Online";
    } else {
      document.getElementById("internet").innerText = "Internet: Offline";
    }
  }

  // run once when page loads
  updateInternetStatus();

  // update when connection changes
  window.addEventListener("online", updateInternetStatus);
  window.addEventListener("offline", updateInternetStatus);
</script>

</body>
</html>
