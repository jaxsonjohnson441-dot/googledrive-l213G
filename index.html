<!DOCTYPE html>
<html>
<head>
  <title>Device + Network Status</title>
  <style>
    #ipContainer {
      display: flex;
      gap: 20px;
      margin-top: 10px;
    }

    .ipBox {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-family: monospace;
    }
  </style>
</head>

<body>

<h1>Network Status</h1>

<p id="os"></p>
<p id="internet"></p>
<p id="ping"></p>

<p id="geo"></p>
<p id="isp"></p>
<p id="connection"></p>
<p id="timezone"></p>

<div id="ipContainer">
  <div class="ipBox">
    <h3>IPv4</h3>
    <p id="ipv4">—</p>
  </div>

  <div class="ipBox">
    <h3>IPv6</h3>
    <p id="ipv6">—</p>
  </div>
</div>

<script>
// OS
let os = "Unknown OS";
let ua = navigator.userAgent;

if (ua.includes("iPhone") || ua.includes("iPad")) os = "iOS";
else if (ua.includes("Android")) os = "Android";
else if (ua.includes("Windows")) os = "Windows";
else if (ua.includes("Mac")) os = "macOS";
else if (ua.includes("Linux")) os = "Linux";

document.getElementById("os").innerText = "OS: " + os;

// Internet
function updateInternet() {
  document.getElementById("internet").innerText =
    "Internet: " + (navigator.onLine ? "Online" : "Offline");
}
updateInternet();
window.addEventListener("online", updateInternet);
window.addEventListener("offline", updateInternet);

// Ping
async function measurePing() {
  const start = performance.now();
  try {
    await fetch("https://www.google.com/favicon.ico", { mode: "no-cors", cache: "no-store" });
    const end = performance.now();
    document.getElementById("ping").innerText =
      "Ping: " + Math.round(end - start) + " ms";
  } catch {
    document.getElementById("ping").innerText = "Ping: Error";
  }
}
measurePing();
setInterval(measurePing, 5000);

// IP + ISP + location


fetch("https://ipapi.co/json/")
  .then(r => r.json())
  .then(data => {
    document.getElementById("geo").innerText =
      `Location: ${data.city}, ${data.region}, ${data.country_name}`;

    document.getElementById("isp").innerText =
      "ISP: " + data.org;
  });

// Connection
function updateConnection() {
  const c = navigator.connection;
  if (!c) {
    document.getElementById("connection").innerText = "Connection: not supported";
    return;
  }
  document.getElementById("connection").innerText =
    "Connection: " + (c.effectiveType || "unknown");
}
updateConnection();

// Timezone
document.getElementById("timezone").innerText =
  "Time zone: " + Intl.DateTimeFormat().resolvedOptions().timeZone;

// IPv4 + IPv6
function getIPs() {
  fetch("https://api4.ipify.org?format=json")
    .then(r => r.json())
    .then(d => document.getElementById("ipv4").innerText = d.ip)
    .catch(() => document.getElementById("ipv4").innerText = "Not available");

  fetch("https://api6.ipify.org?format=json")
    .then(r => r.json())
    .then(d => document.getElementById("ipv6").innerText = d.ip)
    }
function maskIPv6Half(ip) {
  let parts = ip.split(":");
  let half = Math.floor(parts.length / 2);
  return parts.slice(0, half).join(":") + ":****:****:****:****";
}
getIPs();

</script>

</body>
</html>
