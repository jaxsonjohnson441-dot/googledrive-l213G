<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Device + Network Status</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      font-family: Arial, sans-serif;
      color: #e2e8f0;
    }

    .card {
      width: 360px;
      background: #111827;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid #1f2937;
    }

    h1 {
      font-size: 18px;
      margin-bottom: 14px;
      color: #38bdf8;
    }

    .row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #1f2937;
      font-size: 14px;
    }

    .row:last-child {
      border-bottom: none;
    }

    .label {
      color: #94a3b8;
    }

    .value {
      color: #e2e8f0;
      font-weight: 500;
      text-align: right;
      max-width: 60%;
      word-break: break-word;
    }

    .status {
      margin-top: 12px;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      display: inline-block;
      background: #16a34a33;
      color: #4ade80;
    }

    .offline {
      background: #ef444433;
      color: #f87171;
    }
  </style>
</head>

<body>

<div class="card">
  <h1>DEVICE + NETWORK STATUS</h1>

  <div class="row">
    <div class="label">Operating System</div>
    <div class="value" id="os">Detecting...</div>
  </div>

  <div class="row">
    <div class="label">Browser</div>
    <div class="value" id="browser">Detecting...</div>
  </div>

  <div class="row">
    <div class="label">Internet</div>
    <div class="value" id="internet">Checking...</div>
  </div>

  <div class="row">
    <div class="label">Ping</div>
    <div class="value" id="ping">Measuring...</div>
</html>
